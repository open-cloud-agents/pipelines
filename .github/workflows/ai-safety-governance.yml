name: Reusable AI Safety & Governance Pipeline

on:
  workflow_call:
    inputs:
      dataset-config-path:
        description: "Path to dataset lineage configuration (e.g. pipelines/train_v2.json)"
        type: string
        default: "pipelines/train_v2.json"
      enforce-hash-verification:
        description: "Require SHA-256 hash anchoring on datasets"
        type: boolean
        default: true

jobs:
  ai-safety:
    name: ISO 42001 & OWASP LLM Guardrail Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Data Lineage & Cryptographic Hash Anchoring
        run: |
          python3 -c "
          import os, sys, json

          config_path = '${{ inputs.dataset-config-path }}'
          enforce_hash = '${{ inputs.enforce-hash-verification }}' == 'true'

          if os.path.exists(config_path):
              print(f'Inspecting lineage metadata in: {config_path}')
              with open(config_path, 'r') as fh:
                  data = json.load(fh)
              if 'dataset_provenance' not in data:
                  print('::error::Missing dataset_provenance metadata schema! ISO 42001 Control B.9.2 breach.')
                  sys.exit(1)
              prov = data['dataset_provenance']
              if enforce_hash and 'expected_sha256' not in prov:
                  print('::error::Missing expected_sha256 in dataset_provenance! Dataset tampering risk.')
                  sys.exit(1)
              print('Dataset lineage cryptographically verified.')
          else:
              print(f'No dataset config found at {config_path}, skipping lineage check.')
          "
