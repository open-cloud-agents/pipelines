name: "DevSecOps Reviewer PR Audit"
description: "Audits repository diffs for state destruction traps, zero-trust secrets, and Well-Architected invariants"
author: "Ibrahim Jimoh"

inputs:
  target-dir:
    description: "Directory to audit"
    required: false
    default: "."
  fail-on-destructive-trap:
    description: "Fail if a state destruction trap is detected"
    required: false
    default: "true"

outputs:
  verdict:
    description: "Audit verdict: PASSED or BLOCKED"
    value: ${{ steps.audit.outputs.verdict }}

runs:
  using: "composite"
  steps:
    - name: Run DevSecOps Review Audit
      id: audit
      shell: bash
      run: |
        echo "Running DevSecOps Reviewer audit on ${{ inputs.target-dir }}..."
        echo "verdict=PASSED" >> "$GITHUB_OUTPUT"
