name: "Setup Open Cloud Agents CLI (ocagents)"
description: "Installs and configures the standalone ocagents CLI in any GitHub Actions runner"
author: "Ibrahim Jimoh"

inputs:
  version:
    description: "Version of ocagents to install"
    required: false
    default: "1.3.0"

runs:
  using: "composite"
  steps:
    - name: Download & Install ocagents CLI
      shell: bash
      run: |
        echo "Installing Open Cloud Agents CLI v${{ inputs.version }}..."
        curl -fsSL https://open-cloud-agents.github.io/ocagents/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Verify CLI Installation
      shell: bash
      run: |
        ocagents info
